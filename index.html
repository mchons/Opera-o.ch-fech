<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Cardápio — demonstração Projeto Chófech</title>
<style>
:root{--bg:#fff;--card:#fff;--ink:#1c1917;--mut:#6b645c;--line:#e5e7ea;--ph:#eef0f2;--ok:#0b7a55;--brand:#d9480f;--hh:150px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
button{font:inherit;color:inherit}
.wrap{display:flex;justify-content:center;align-items:flex-start}
.app{width:100%;max-width:430px;min-height:100vh;background:var(--card)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px 0}
.logo{width:40px;height:40px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
.top b{display:block;font-size:18px;line-height:1.1}
.top small{color:var(--mut);font-size:12px}
.demo{margin-left:auto;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);border:1px solid var(--line);border-radius:12px;padding:4px 8px;text-align:center;line-height:1.25}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:10px 14px 0;padding:4px;background:var(--ph);border-radius:14px}
.seg button{min-height:46px;border:0;border-radius:10px;background:transparent;color:var(--mut);font-weight:800;letter-spacing:.05em;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--card);box-shadow:0 1px 5px #0004}
[data-mode=proposta] .seg button[aria-pressed=true]{background:var(--ok);color:#fff}
.status{margin:6px 14px 0;font-size:12.5px;color:var(--mut);display:flex;gap:6px;align-items:center}
.status i{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
[data-mode=proposta] .status i{background:var(--ok)}
nav{display:flex;overflow-x:auto;padding:0 6px;margin-top:8px;border-top:1px solid var(--line)}
nav button{flex:none;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--mut);padding:10px 14px;font-weight:600;min-height:46px;cursor:pointer}
nav button.on{color:var(--ink);border-bottom-color:var(--brand)}
section.cat{padding-top:14px;scroll-margin-top:calc(var(--hh) + 8px)}
section.cat h2{margin:0 14px 10px;font-size:20px}
.card{display:block;margin:0 14px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.card:focus-visible{outline:3px solid var(--brand)}
.card .bd{flex:1;min-width:0;padding:0}
.cb{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-top:6px}
.card .img{flex:none;width:120px;aspect-ratio:4/3;border-radius:12px}
.card .ph{padding:6px;font-size:10px}
.card .pp b{font-size:28px;overflow-wrap:anywhere}
.card .pp em{font-size:9px;right:4px;bottom:4px;padding:2px 4px}
.pr2{margin-top:8px}
.img{aspect-ratio:1;position:relative;overflow:hidden;display:grid;place-items:center;text-align:center}
.img img{width:100%;height:100%;object-fit:cover}
.ph{background:var(--ph);color:var(--mut);font-size:13px;padding:16px}
.ph.pp{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 18%,var(--card)),color-mix(in srgb,var(--brand) 50%,var(--card)));color:var(--ink)}
.pp b{font-size:60px;line-height:1;display:block}
.pp em{position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:600;font-style:normal;background:#0009;color:#fff;border-radius:6px;padding:4px 6px}
.bd{padding:12px 14px 14px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
h2,h3{margin:0}
h3{font-size:17px;line-height:1.25}
.pr{font-weight:800;font-size:17px;white-space:nowrap}
.selo{display:inline-block;background:var(--brand);color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;margin-bottom:6px}
.desc{margin:6px 0 0;color:var(--mut);font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{background:var(--ph);border-radius:99px;padding:5px 11px;font-size:14px}
.chips b{font-weight:800}
dl{margin:10px 0 0;display:grid;gap:6px}
dl div{display:grid;grid-template-columns:90px 1fr;gap:8px;font-size:14px}
dt{font-weight:700;color:var(--mut);font-size:13px;padding-top:1px}
dd{margin:0}
.aviso{margin:6px 14px 24px;color:var(--mut);font-size:12px}
#sheet{position:fixed;z-index:6;bottom:0;background:var(--card);overflow:auto;border-radius:18px 18px 0 0;box-shadow:0 -6px 24px #0004;padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet[hidden],#prep[hidden]{display:none}
.back{margin:12px 14px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:9px 16px;min-height:44px;font-weight:600;cursor:pointer}
#sheet .img{aspect-ratio:16/10;background:var(--ph);margin:0 14px;border-radius:16px}
#sheet .img img{object-fit:contain}
#sheet .bd{padding:14px}
#sheet h2{font-size:22px;line-height:1.2}
.nota{margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:14.5px}
.nota h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.nota ul,aside ul{margin:0;padding-left:18px}
.nota p,aside p{margin:0}
aside{display:none}
aside h2{font-size:18px}
.sub{color:var(--mut);font-size:13.5px;margin:4px 0 12px}
.op{padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;font-size:14px}
.op b{display:block;margin-bottom:4px}
#prep{position:fixed;right:12px;bottom:12px;z-index:20;width:280px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:13px;box-shadow:0 6px 24px #0005}
#prep label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
#prep input[type=number]{width:90px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
@media(min-width:900px){
.wrap{padding:24px;gap:32px}
.app{border:1px solid var(--line);border-radius:22px;min-height:calc(100vh - 48px)}
header{border-radius:22px 22px 0 0}
aside{display:block;width:360px;position:sticky;top:24px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
}
#ed{position:fixed;inset:0;z-index:30;overflow:auto;background:#fff;color:var(--ink);padding:env(safe-area-inset-top,0px) 0 130px}
#ed[hidden]{display:none}
.bar{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.bar span{margin-left:auto;color:var(--mut);font-size:13px}
.cx{max-width:640px;margin:0 auto;padding:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cx h2,.cx p{flex:1 1 100%;margin:0}
#fm{max-width:640px;margin:0 auto;padding:0 16px}
#ed label{display:block;margin:10px 0;font-size:13px;color:var(--mut)}
#ed input:not([type=file]),#ed textarea,#ed select{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;color:var(--ink);background:#fff}
#ed .cx select{flex:1 1 100%;margin:0}
#ed input[type=color]{height:44px;padding:2px}
#ed button{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:600;cursor:pointer}
#ed .pri{background:var(--brand);border-color:var(--brand);color:#fff}
#ed details{border:1px solid var(--line);border-radius:14px;padding:4px 14px 14px;margin:14px 0}
#ed summary{padding:10px 0;font-weight:700;cursor:pointer}
.fo img{display:block;width:72px;height:72px;object-fit:cover;border-radius:10px;margin:4px 0}
.rod{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line)}
.rod span{flex:1 1 100%;font-size:12px;color:var(--mut);min-height:14px;overflow-wrap:anywhere}
.top{padding:10px 14px 0}
.circ{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--ph);font-size:20px;cursor:pointer}
.srch{flex:1;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:2px solid var(--ink);border-radius:99px}
.srch input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;color:var(--ink)}
.idl{display:flex;align-items:center;gap:8px;padding:8px 14px 0}
.idl b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.idl .demo{margin-left:auto;white-space:nowrap}
.logo{width:24px;height:24px;border-radius:8px;font-size:11px}
.er{color:#b42318;font-size:13px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
#ed .tabs button{flex:1;border:0;border-bottom:3px solid transparent;border-radius:0;background:#fff;color:var(--mut)}
#ed .tabs button.on{color:var(--ink);border-bottom-color:var(--brand)}
.cli{display:grid;gap:6px;border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.cli span{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<div class="app">
<header>
<div class="top"><button class="circ" id="bk" aria-label="Voltar">←</button><label class="srch"><input id="q" type="search" placeholder="Buscar"><span aria-hidden="true">🔍</span></label></div>
<div class="idl"><div class="logo" id="logo"></div><b id="nome"></b><span class="demo">Demonstração · Chófech</span></div>
<div class="seg" role="group" aria-label="Versão do cardápio"><button data-m="original">ORIGINAL</button><button data-m="proposta">PROPOSTA</button></div>
<nav id="cats" aria-label="Categorias"></nav>
</header>
<main id="menu"></main>
</div>
<aside id="side"></aside>
</div>
<div id="sheet" hidden></div>
<div id="prep" hidden></div>
<div id="ed"><div class="cx"><p>Carregando…</p></div></div>

let N=DEMO.negocio,$=s=>document.querySelector(s),root=document.documentElement;
const P=id=>DEMO.produtos.find(p=>p.id===id),R=v=>"R$ "+Number(v).toFixed(2).replace(".",",");
let mode="original",openId=null,Q="";
const ach=p=>!Q||(p.original.titulo+" "+p.proposta.titulo+" "+(p.original.descricao||"")).toLowerCase().includes(Q);

const preco=p=>N.mostrarPrecos===false||p.preco==null?"":`<span class="pr">${R(p.preco)}</span>`;
function img(p,m){
 const i=p.imagem[m]||{};
 if(i.src)return `<div class="img"><img src="${i.src}" alt="${p[m].titulo}"></div>`;
 return m==="original"
  ?`<div class="img ph"><span>Imagem do anúncio original<br>(não incluída)</span></div>`
  :`<div class="img ph pp"><b>${i.emoji||"🍽️"}</b><em>Imagem ilustrativa</em></div>`;
}
function corpo(p,m){
 const d=p[m];
 let h="";
 if(d.inclui)h+=`<div class="chips">${d.inclui.map(x=>`<span>${x.replace(/^(\d+)/,"<b>$1</b>")}</span>`).join("")}</div>`;
 if(d.grupos)h+=`<dl>${d.grupos.map(g=>`<div><dt>${g.nome}</dt><dd>${g.itens.join(", ")}</dd></div>`).join("")}</dl>`;
 return h||(d.descricao?`<p class="desc">${d.descricao}</p>`:"");
}
const selo=(p,m)=>m==="proposta"&&p[m].selo?`<span class="selo">${p[m].selo}</span>`:"";
const nota=(p,pr)=>pr?"<ul>"+p.mudancas.map(x=>`<li>${x}</li>`).join("")+"</ul>":`<p>${p.observacao}</p>`;
function card(p){
 const d=p[mode];
 return `<article class="card" data-id="${p.id}" tabindex="0" role="button" aria-label="Ver detalhes: ${d.titulo}">${selo(p,mode)}<h3>${d.titulo}</h3><div class="cb"><div class="bd">${corpo(p,mode)}<div class="pr2">${preco(p)}</div></div>${img(p,mode)}</div></article>`;
}
function detalhe(p){
 const pr=mode==="proposta";
 return `<button class="back" id="back">← Voltar ao cardápio</button>${img(p,mode)}<div class="bd">${selo(p,mode)}<div class="row"><h2>${p[mode].titulo}</h2>${preco(p)}</div>${corpo(p,mode)}<div class="nota"><h4>${pr?"O que muda nesta proposta":"Oportunidade observada"}</h4>${nota(p,pr)}</div></div>`;
}
function lateral(){
 const pr=mode==="proposta";
 return `<h2>${pr?"O que muda na proposta":"Oportunidades observadas"}</h2><p class="sub">${pr?"Mesmos produtos, apresentados com mais clareza.":"Pontos identificados a partir das informações de referência."}</p>`
 +DEMO.produtos.map(p=>`<div class="op" data-id="${p.id}"><b>${p[mode].titulo}</b>${nota(p,pr)}</div>`).join("")
 +`<p class="sub">Alterações de apresentação; não há resultado de vendas medido.</p>`;
}
function place(){
 const r=$(".app").getBoundingClientRect();
 Object.assign($("#sheet").style,{left:r.left+"px",width:r.width+"px",top:$("header").getBoundingClientRect().bottom+"px"});
}
function render(){
 root.dataset.mode=mode;
 document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===mode));
 $("#menu").innerHTML=DEMO.categorias.map(c=>`<section class="cat" id="sec-${c.id}"><h2>${c.nome}</h2>${DEMO.produtos.filter(p=>p.cat===c.id&&ach(p)).map(card).join("")}</section>`).join("")+`<p class="aviso">${N.aviso}</p>`;
 $("#side").innerHTML=lateral();
 root.style.setProperty("--hh",$("header").offsetHeight+"px");
 if(openId){$("#sheet").innerHTML=detalhe(P(openId));place()}
}
function setMode(m){
 if(m===mode)return;
 const h=$("header").offsetHeight,a=[...document.querySelectorAll(".card")].find(c=>c.getBoundingClientRect().bottom>h+10);
 const y=a?a.getBoundingClientRect().top:0,id=a&&a.dataset.id;
 mode=m;render();
 if(id)scrollBy(0,$(`.card[data-id="${id}"]`).getBoundingClientRect().top-y);
}
function open(id){openId=id;$("#sheet").innerHTML=detalhe(P(id));$("#sheet").hidden=false;place();$("#sheet").scrollTop=0}
function close(){openId=null;$("#sheet").hidden=true}
function setCat(id){document.querySelectorAll("#cats button").forEach(b=>b.classList.toggle("on",b.dataset.c===id))}
function prep(){
 const on=location.hash==="#preparar",box=$("#prep");
 box.hidden=!on;
 if(on&&!box.dataset.ok){
  box.dataset.ok=1;
  box.innerHTML=`<b>Preparação (uso interno)</b><label><span>Ocultar preços</span><input type="checkbox" id="np"></label>`
  +DEMO.produtos.map(p=>`<label><span>${p.original.titulo.slice(0,20)}</span><input type="number" step="0.01" min="0" data-p="${p.id}" value="${p.preco}"></label>`).join("")
  +`<small>Aparece só com #preparar no fim do link. Vale até recarregar a página.</small>`;
 }
}

document.addEventListener("click",e=>{
 const t=e.target,b=t.closest(".seg button"),c=t.closest("#cats button"),k=t.closest("[data-id]");
 if(b)return setMode(b.dataset.m);
 if(c){close();setCat(c.dataset.c);return $("#sec-"+c.dataset.c).scrollIntoView({behavior:"smooth",block:"start"})}
 if(t.closest("#back"))return close();
 if(k&&!t.closest("#sheet"))open(k.dataset.id);
});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape")close();
 if(e.key==="Enter"&&e.target.matches(".card"))open(e.target.dataset.id);
});
document.addEventListener("input",e=>{
 const t=e.target;
 if(t.id==="np")N.mostrarPrecos=!t.checked;
 else if(t.dataset.p){const v=parseFloat(t.value);P(t.dataset.p).preco=isNaN(v)?null:v}
 else return;
 render();
});
addEventListener("scroll",()=>{
 let cur=DEMO.categorias[0].id;
 DEMO.categorias.forEach(c=>{const s=$("#sec-"+c.id);if(s&&s.getBoundingClientRect().top<$("header").offsetHeight+40)cur=c.id});
 setCat(cur);
},{passive:true});
addEventListener("resize",()=>{if(openId)place()});
addEventListener("hashchange",prep);

function boot(){root.style.setProperty("--brand",N.cor);
document.title=N.nome+" — cardápio (demonstração)";
$("#nome").textContent=N.nome;$("#q").placeholder="Buscar em "+N.nome;
$("#logo").innerHTML=N.logo?`<img src="${N.logo}" alt="">`:N.iniciais;
$("#cats").innerHTML=DEMO.categorias.map((c,i)=>`<button data-c="${c.id}"${i?"":' class="on"'}>${c.nome}</button>`).join("");
render();prep()}
boot();
$("#q").oninput=e=>{Q=e.target.value.trim().toLowerCase();render()};
</script>
<script>
/* ===== ACESSO + EDITOR ===== */
const FB={apiKey:"AIzaSyCQ1tUjv-OaqotLkkDkxi9WZvpxg37SbKc",authDomain:"operacao-chofech.firebaseapp.com",projectId:"operacao-chofech",storageBucket:"operacao-chofech.firebasestorage.app",messagingSenderId:"192960923627",appId:"1:192960923627:web:56dcf035e9ca9a672c7bae"}; // cole aqui a config do Firebase
const DONO="cristian.ferreira.bk@gmail.com"; // e-mail Google autorizado a editar
const DEMO0=JSON.parse(JSON.stringify(DEMO));
const E=s=>String(s??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const ed=$("#ed"),wrap=document.querySelector(".wrap");
let fb=null,user=null,cur=null,curId=null;
wrap.style.visibility="hidden";
const novoProd=()=>({id:"p"+Date.now().toString(36),cat:"",preco:null,imagem:{original:{src:""},proposta:{src:"",emoji:"🍽️"}},original:{titulo:"",descricao:""},proposta:{titulo:""},observacao:"",mudancas:[]});
const vazio=()=>({negocio:{...DEMO0.negocio,nome:"Novo estabelecimento",iniciais:"NE",logo:""},categorias:[{id:"cat1",nome:"Categoria 1"}],produtos:[{...novoProd(),cat:"cat1"}]});
const clone=o=>JSON.parse(JSON.stringify(o));
const get=(o,k)=>k.split(".").reduce((a,x)=>a&&a[x],o);
function set(o,k,v){const a=k.split("."),l=a.pop();a.reduce((x,y)=>x[y],o)[l]=v}
const linhas=v=>v.split("\n").map(s=>s.trim()).filter(Boolean);
const T={
 txt:{r:v=>v??"",w:v=>v},
 num:{r:v=>v??"",w:v=>v===""?null:parseFloat(v)},
 ln:{r:v=>(v||[]).join("\n"),w:v=>{const a=linhas(v);return a.length?a:undefined}},
 gr:{r:v=>(v||[]).map(g=>g.nome+": "+g.itens.join(", ")).join("\n"),w:v=>{const a=linhas(v).map(s=>{const[n,...r]=s.split(":");return{nome:n.trim(),itens:r.join(":").split(",").map(x=>x.trim()).filter(Boolean)}});return a.length?a:undefined}},
 cat:{r:v=>(v||[]).map(c=>c.id+": "+c.nome).join("\n"),w:v=>linhas(v).map(s=>{const[i,...r]=s.split(":");return{id:i.trim(),nome:r.join(":").trim()||i.trim()}})}
};
T.cor=T.txt;T.ln0={r:T.ln.r,w:v=>T.ln.w(v)||[]};

const campo=(k,rot,t="txt",ta)=>{
 const v=E(T[t].r(get(cur,k))),d=`data-k="${k}" data-t="${t}"`;
 return `<label>${rot}${ta?`<textarea ${d} rows="3">${v}</textarea>`:`<input ${d} value="${v}"${t==="num"?' type="number" step="0.01" inputmode="decimal"':t==="cor"?' type="color"':""}>`}</label>`;
};
const foto=(k,rot)=>{const v=get(cur,k);return `<label>${rot}<span class="fo">${v?`<img src="${E(v)}" alt="">`:""}<input type="file" accept="image/*" data-f="${k}"></span></label>`};
function form(){
 $("#fm").innerHTML=`<h3>Estabelecimento</h3>`+campo("negocio.nome","Nome")+campo("negocio.iniciais","Iniciais do logotipo")+campo("negocio.cor","Cor principal","cor")+foto("negocio.logo","Logotipo (opcional)")
 +campo("categorias","Categorias (uma por linha, no formato id: Nome)","cat",1)
 +cur.produtos.map((p,i)=>{const b=`produtos.${i}.`;return `<details open><summary>${E(p.original.titulo||p.proposta.titulo||"Novo produto")}</summary>`
  +campo(b+"cat","Categoria (id)")+campo(b+"preco","Preço (R$)","num")
  +`<h4>Original</h4>`+campo(b+"original.titulo","Título")+campo(b+"original.descricao","Descrição",0,1)+foto(b+"imagem.original.src","Foto do original")
  +`<h4>Proposta</h4>`+campo(b+"proposta.titulo","Título")+campo(b+"proposta.selo","Selo (ex.: Combo)")+campo(b+"proposta.inclui","Itens incluídos (um por linha, opcional)","ln",1)+campo(b+"proposta.grupos","Grupos (Nome: item, item; um por linha, opcional)","gr",1)+foto(b+"imagem.proposta.src","Foto da proposta (opcional)")+campo(b+"imagem.proposta.emoji","Ilustração enquanto não há foto (emoji)")
  +`<h4>Observações</h4>`+campo(b+"observacao","Oportunidade observada (aparece no ORIGINAL)",0,1)+campo(b+"mudancas","O que muda (um por linha)","ln0",1)
  +`<button data-rm="${i}">Remover produto</button></details>`}).join("")
 +`<button id="addp">+ Adicionar produto</button>`;
}
const reduz=(f,m)=>new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL(m<=160?"image/png":"image/jpeg",.8))};i.src=URL.createObjectURL(f)});
const st=t=>{const e=$("#st");if(e)e.textContent=t};

function aplicar(d){DEMO=d;N=d.negocio;mode="original";openId=null;Q="";$("#q").value="";$("#sheet").hidden=true;boot();wrap.style.visibility="visible";scrollTo(0,0)}
async function listar(){
 const{F,db}=fb,q=F.query(F.collection(db,"propostas"),F.where("owner","==",user.uid));
 const l=(await F.getDocs(q)).docs.map(d=>({id:d.id,nome:d.data().nome,em:d.data().em||0})).sort((a,b)=>b.em-a.em);
 $("#sel").innerHTML=`<option value="">— nova proposta —</option>`+l.map(x=>`<option value="${x.id}"${x.id===curId?" selected":""}>${E(x.nome)}</option>`).join("");
 return l;
}
async function abrir(id,d){
 if(id){const s=await fb.F.getDoc(fb.F.doc(fb.db,"propostas",id));d=JSON.parse(s.data().json)}
 cur=d;curId=id;form();$("#sel").value=id||"";st(id?"":"Proposta ainda não salva");
}
async function salvar(){
 if(!curId)curId=crypto.randomUUID().replace(/-/g,"").slice(0,12);
 await fb.F.setDoc(fb.F.doc(fb.db,"propostas",curId),{owner:user.uid,nome:cur.negocio.nome,json:JSON.stringify(cur),em:Date.now()});
 await listar();st("Salvo");
}
ed.addEventListener("input",e=>{const t=e.target,k=t.dataset.k;if(!k)return;set(cur,k,T[t.dataset.t].w(t.value));st("Alterações não salvas")});
ed.addEventListener("change",async e=>{
 const t=e.target;
 if(t.dataset.u)return fb.F.updateDoc(fb.F.doc(fb.db,"usuarios",t.dataset.u),{propostaId:t.value});
 if(t.id==="sel")return t.value?abrir(t.value):abrir(null,vazio());
 const k=t.dataset.f;if(!k||!t.files[0])return;
 set(cur,k,await reduz(t.files[0],k.startsWith("negocio")?160:480));form();st("Alterações não salvas");
});
const ehAdmin=()=>user&&user.email===DONO&&user.emailVerified;
const tela=(h,p,b="")=>{ed.hidden=false;ed.innerHTML=`<div class="cx"><h2>${h}</h2><p>${p}</p>${b}<p id="er" class="er"></p></div>`};
const login=()=>tela("Chófech","Entre para ver o cardápio.",`<input id="em" type="email" placeholder="E-mail" autocomplete="username"><input id="pw" type="password" placeholder="Senha" autocomplete="current-password"><button class="pri" data-a="login">Entrar</button><button data-a="entrar">Entrar com Google (administrador)</button>`);
const tab=v=>ed.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));

async function iniciarFB(){
 if(!FB.apiKey)return null;
 const u=m=>`https://www.gstatic.com/firebasejs/10.12.2/firebase-${m}.js`;
 const[A,Au,F]=await Promise.all([import(u("app")),import(u("auth")),import(u("firestore"))]);
 const app=A.initializeApp(FB);
 return{A,Au,F,auth:Au.getAuth(app),db:F.getFirestore(app)};
}
async function rota(u){
 user=u;
 if(!u)return login();
 if(ehAdmin())return painel();
 try{
  const{F,db}=fb,s=await F.getDoc(F.doc(db,"usuarios",u.uid));
  if(!s.exists())return tela("Sem proposta vinculada","Peça ao Projeto Chófech para liberar seu acesso.",`<button data-a="sair">Sair</button>`);
  const p=await F.getDoc(F.doc(db,"propostas",s.data().propostaId));
  aplicar(JSON.parse(p.data().json));ed.hidden=true;
 }catch(x){tela("Não foi possível abrir","Tente novamente em instantes.",`<button data-a="sair">Sair</button>`)}
}
function painel(){
 ed.hidden=false;
 ed.innerHTML=`<div class="bar"><b>Chófech · Admin</b><span>${E(user.email)}</span><button data-a="sair">Sair</button></div><div class="tabs"><button data-a="aba" data-v="prop">Propostas</button><button data-a="aba" data-v="cli">Clientes</button></div><div id="bd"></div>`;
 abaProp();
}
function abaProp(){
 tab("prop");
 $("#bd").innerHTML=`<div class="cx"><select id="sel"></select><button data-a="nova">Nova em branco</button><button data-a="dup">Duplicar</button></div><div id="fm"></div><div class="rod"><span id="st"></span><button data-a="salvar">Salvar</button><button class="pri" data-a="prev">Pré-visualizar</button></div>`;
 listar().then(l=>l[0]?abrir(l[0].id):abrir(null,clone(DEMO0)));
}
async function abaCli(){
 tab("cli");
 const{F,db}=fb;
 const us=(await F.getDocs(F.collection(db,"usuarios"))).docs.map(d=>({id:d.id,...d.data()}));
 const ps=(await F.getDocs(F.query(F.collection(db,"propostas"),F.where("owner","==",user.uid)))).docs.map(d=>({id:d.id,nome:d.data().nome}));
 const op=s=>ps.map(p=>`<option value="${p.id}"${p.id===s?" selected":""}>${E(p.nome)}</option>`).join("");
 $("#bd").innerHTML=`<div id="fm"><h3>Novo cliente</h3><label>Nome do cliente<input id="cn"></label><label>E-mail de acesso<input id="ce" type="email"></label><label>Senha (mínimo 6 caracteres)<input id="cs"></label><label>Proposta que ele verá<select id="cp">${op()}</select></label><button class="pri" data-a="criar">Criar cliente</button><p id="er" class="er"></p><h3>Clientes</h3>`
 +us.map(u=>`<div class="cli"><b>${E(u.nome)}</b><span>${E(u.email)}</span><select data-u="${u.id}">${op(u.propostaId)}</select><button data-a="desat" data-u="${u.id}">Desativar acesso</button></div>`).join("")+`</div>`;
}
function erro(x){
 const c=x.code||"",m=/credential|password|user-not-found/.test(c)?"E-mail ou senha incorretos.":c==="auth/email-already-in-use"?"Este e-mail já tem conta.":c.includes("permission")?"Sem permissão: confira as regras do Firestore e o e-mail do administrador.":(c||x.message);
 const e=$("#er");e?e.textContent=m:alert(m);
}

ed.addEventListener("click",async e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.id==="addp"){cur.produtos.push({...novoProd(),cat:cur.categorias[0]?.id||""});return form()}
 if(b.dataset.rm){cur.produtos.splice(+b.dataset.rm,1);return form()}
 const a=b.dataset.a,{Au,F,db}=fb;
 try{
  if(a==="login")await Au.signInWithEmailAndPassword(fb.auth,$("#em").value.trim(),$("#pw").value);
  if(a==="entrar")await Au.signInWithPopup(fb.auth,new Au.GoogleAuthProvider());
  if(a==="sair")Au.signOut(fb.auth);
  if(a==="aba")b.dataset.v==="cli"?await abaCli():abaProp();
  if(a==="nova")abrir(null,vazio());
  if(a==="dup")abrir(null,clone(cur));
  if(a==="salvar")await salvar();
  if(a==="prev"){aplicar(cur);ed.hidden=true}
  if(a==="criar"){
   const n=$("#cn").value.trim(),m=$("#ce").value.trim(),s=$("#cs").value,p=$("#cp").value;
   if(!n||!m||s.length<6||!p)return $("#er").textContent="Preencha nome, e-mail, senha (6 ou mais) e proposta.";
   fb.sec=fb.sec||fb.A.initializeApp(FB,"sec");
   const au2=Au.getAuth(fb.sec),c=await Au.createUserWithEmailAndPassword(au2,m,s);
   await F.setDoc(F.doc(db,"usuarios",c.user.uid),{nome:n,email:m,propostaId:p,em:Date.now()});
   await Au.signOut(au2);await abaCli();
  }
  if(a==="desat"){await F.deleteDoc(F.doc(db,"usuarios",b.dataset.u));await abaCli()}
 }catch(x){erro(x)}
});
ed.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="pw")ed.querySelector("[data-a=login]").click()});
$("#bk").onclick=()=>{if(!fb||!user)return;if(ed.hidden&&ehAdmin())ed.hidden=false;else fb.Au.signOut(fb.auth)};

(async()=>{
 if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
 try{fb=await iniciarFB()}catch(x){fb=null}
 if(!fb)return tela("Chófech","Preencha a configuração do Firebase (FB) no início do script.");
 fb.Au.onAuthStateChanged(fb.auth,rota);
})();

</script>
